<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VLESS Railway Panel</title><style>body{font-family:system-ui;margin:0;background:#0b1020;color:#eee}.wrap{max-width:1000px;margin:40px auto;padding:20px}.card{background:#141b2d;border:1px solid #28324a;border-radius:16px;padding:22px;margin:16px 0}input,button,textarea{width:100%;box-sizing:border-box;padding:12px;border-radius:9px;border:1px solid #34415f;background:#0e1526;color:#fff;margin:6px 0}button{cursor:pointer}.hidden{display:none}.url{min-height:90px;font-family:monospace}.ok{padding:10px;background:#12351f;border-radius:8px}.err{padding:10px;background:#421b20;border-radius:8px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:700px){.row{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>VLESS Railway Panel</h1><div id="login" class="card"><h2>Login</h2><p>Enter your credentials manually.</p><input id="u" placeholder="Username" autocomplete="username"><input id="p" type="password" placeholder="Password" autocomplete="current-password"><button onclick="login()">Login</button><div id="le"></div></div><div id="app" class="hidden"><div class="card"><div class="row"><div><h2>Connection profiles</h2><p id="domain"></p></div><div><button onclick="loadConfigs()">Regenerate</button><button onclick="logout()">Logout</button></div></div><div id="out"></div></div><div class="card"><h2>Change password</h2><input id="np" type="password" placeholder="New password (8+ characters)"><button onclick="changePw()">Change password</button><div id="pe"></div></div></div></div><script>const $=x=>document.getElementById(x);async function api(u,o){return fetch(u,o)}async function login(){let r=await api('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:$('u').value,password:$('p').value})});if(r.ok){$('login').classList.add('hidden');$('app').classList.remove('hidden');loadConfigs()}else $('le').innerHTML='<div class="err">Invalid username or password</div>'}async function loadConfigs(){let r=await api('/api/configs');if(r.status===401)return;let x=await r.json();$('domain').textContent='Domain: '+x.domain+':443';$('out').innerHTML=x.configs.map(c=>`<div class="card"><h3>${c.name}</h3><p>VLESS · ${c.transport.toUpperCase()} · TLS · ${c.path}</p><textarea class="url" readonly>${c.url}</textarea><button onclick="navigator.clipboard.writeText(this.previousElementSibling.value)">Copy configuration</button></div>`).join('')}async function changePw(){let r=await api('/api/password',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:$('np').value})});$('pe').innerHTML=r.ok?'<div class="ok">Password changed.</div>':'<div class="err">Password change failed.</div>'}async function logout(){await api('/api/logout');location.reload()}</script></body></html>
